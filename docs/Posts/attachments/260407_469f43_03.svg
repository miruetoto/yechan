<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="serif" font-size="14">
  <!-- Left clique (large, 4 nodes) -->
  <circle cx="80" cy="80" r="18" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>
  <circle cx="140" cy="40" r="18" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>
  <circle cx="140" cy="120" r="18" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>
  <circle cx="200" cy="80" r="18" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>

  <!-- Left clique edges (complete K4) -->
  <line x1="80" y1="80" x2="140" y2="40" stroke="#666" stroke-width="1.2"/>
  <line x1="80" y1="80" x2="140" y2="120" stroke="#666" stroke-width="1.2"/>
  <line x1="80" y1="80" x2="200" y2="80" stroke="#666" stroke-width="1.2"/>
  <line x1="140" y1="40" x2="140" y2="120" stroke="#666" stroke-width="1.2"/>
  <line x1="140" y1="40" x2="200" y2="80" stroke="#666" stroke-width="1.2"/>
  <line x1="140" y1="120" x2="200" y2="80" stroke="#666" stroke-width="1.2"/>

  <!-- Bridge -->
  <line x1="200" y1="80" x2="320" y2="80" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Right clique (small, 2 nodes) -->
  <circle cx="320" cy="80" r="18" fill="#f5a623" stroke="#333" stroke-width="1.5"/>
  <circle cx="400" cy="80" r="18" fill="#f5a623" stroke="#333" stroke-width="1.5"/>

  <!-- Right clique edge -->
  <line x1="320" y1="80" x2="400" y2="80" stroke="#666" stroke-width="1.2"/>

  <!-- Node labels -->
  <text x="80" y="85" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₁</text>
  <text x="140" y="45" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₂</text>
  <text x="140" y="125" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₃</text>
  <text x="200" y="85" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₄</text>
  <text x="320" y="85" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₅</text>
  <text x="400" y="85" text-anchor="middle" fill="white" font-weight="bold" font-size="12">v₆</text>

  <!-- Clique labels -->
  <text x="130" y="170" text-anchor="middle" fill="#4a90d9" font-size="13" font-style="italic">K₄ (deg=3)</text>
  <text x="360" y="170" text-anchor="middle" fill="#f5a623" font-size="13" font-style="italic">K₂ (deg=1)</text>
  <text x="260" y="65" text-anchor="middle" fill="#e74c3c" font-size="12">bridge</text>

  <!-- Height plateau illustration -->
  <line x1="40" y1="210" x2="480" y2="210" stroke="#999" stroke-width="0.8"/>
  <text x="30" y="200" text-anchor="end" fill="#666" font-size="11">h</text>

  <!-- Plateau bars -->
  <rect x="60" y="195" width="30" height="15" fill="#4a90d9" opacity="0.7"/>
  <rect x="120" y="195" width="30" height="15" fill="#4a90d9" opacity="0.7"/>
  <rect x="150" y="195" width="30" height="15" fill="#4a90d9" opacity="0.7"/>
  <rect x="190" y="195" width="30" height="15" fill="#4a90d9" opacity="0.7"/>
  <rect x="300" y="195" width="30" height="15" fill="#f5a623" opacity="0.7"/>
  <rect x="380" y="195" width="30" height="15" fill="#f5a623" opacity="0.7"/>

  <text x="260" y="245" text-anchor="middle" fill="#333" font-size="12">μ₀ ∝ deg → K₄ 쪽에 눈 집중, K₂ 쪽 상대적 결핍</text>
  <text x="260" y="258" text-anchor="middle" fill="#333" font-size="12">1-step: μ₀ 편향 ≫ bridge flow 균등화 → 양의 drift 가능</text>
</svg>
