<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="serif">
  <rect width="700" height="420" fill="white"/>

  <!-- Height axis -->
  <line x1="55" y1="30" x2="55" y2="390" stroke="#888" stroke-width="1.5"/>
  <polygon points="55,25 51,35 59,35" fill="#888"/>
  <text x="30" y="22" font-size="14" fill="#888" font-style="italic">h</text>

  <!-- Mean height line h̄(t+s) -->
  <line x1="50" y1="210" x2="460" y2="210" stroke="#888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="465" y="214" font-size="12" fill="#888" font-style="italic">h̄(t+s)</text>

  <!-- u node bar -->
  <rect x="150" y="70" width="70" height="140" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5" rx="3"/>
  <circle cx="185" cy="70" r="8" fill="#E74C3C" stroke="#B03A2E" stroke-width="2"/>
  <text x="160" y="58" font-size="15" fill="#E74C3C" font-weight="bold" font-style="italic">u</text>

  <!-- w node bar -->
  <rect x="300" y="70" width="70" height="270" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5" rx="3"/>
  <circle cx="335" cy="340" r="8" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="310" y="368" font-size="15" fill="#27AE60" font-weight="bold" font-style="italic">w</text>

  <!-- Block indicator -->
  <rect x="135" y="8" width="120" height="22" fill="#F5B7B1" stroke="#E74C3C" stroke-width="1" rx="3"/>
  <text x="145" y="23" font-size="11" fill="#922B21" font-weight="bold">block 발생 → 새 눈!</text>

  <!-- Snow falling on u: X_fall = u -->
  <path d="M185,32 L185,58" stroke="#3498DB" stroke-width="2.5" stroke-dasharray="5,3" fill="none" marker-end="url(#aBlue)"/>
  <text x="260" y="45" font-size="13" fill="#3498DB">❄ 새 눈이</text>
  <text x="260" y="62" font-size="13" fill="#3498DB" font-style="italic">u</text>
  <text x="272" y="62" font-size="13" fill="#3498DB">에 낙하</text>
  <text x="260" y="79" font-size="12" fill="#3498DB">(</text>
  <text x="267" y="79" font-size="12" fill="#3498DB" font-style="italic">X</text>
  <text x="278" y="83" font-size="8" fill="#3498DB">fall</text>
  <text x="296" y="79" font-size="12" fill="#3498DB">= </text>
  <text x="308" y="79" font-size="12" fill="#3498DB" font-style="italic">u</text>
  <text x="318" y="79" font-size="12" fill="#3498DB">, 확률 ≥ μ</text>
  <text x="399" y="83" font-size="8" fill="#3498DB">min</text>
  <text x="417" y="79" font-size="12" fill="#3498DB">)</text>

  <!-- +b label at u -->
  <text x="192" y="68" font-size="13" fill="#E67E22" font-weight="bold">+b</text>

  <!-- Flow arrow from u to w -->
  <path d="M193,78 C230,150 280,270 330,332" stroke="#E74C3C" stroke-width="3" fill="none" marker-end="url(#aRed)"/>
  <text x="208" y="220" font-size="13" fill="#E74C3C" font-weight="bold" transform="rotate(62,208,220)">flow ↓</text>

  <!-- Steep edge height difference bracket -->
  <line x1="120" y1="70" x2="120" y2="340" stroke="#E74C3C" stroke-width="2"/>
  <line x1="113" y1="70" x2="127" y2="70" stroke="#E74C3C" stroke-width="2"/>
  <line x1="113" y1="340" x2="127" y2="340" stroke="#E74C3C" stroke-width="2"/>
  <text x="70" y="195" font-size="13" fill="#E74C3C">≥</text>
  <text x="63" y="213" font-size="13" fill="#E74C3C" font-style="italic">M(t)</text>
  <line x1="63" y1="216" x2="125" y2="216" stroke="#E74C3C" stroke-width="0.8"/>
  <text x="63" y="231" font-size="12" fill="#E74C3C">2(</text>
  <text x="77" y="231" font-size="12" fill="#E74C3C" font-style="italic">n</text>
  <text x="88" y="231" font-size="12" fill="#E74C3C">− 1)</text>

  <!-- h_{X*} bracket: from mean line down to w -->
  <line x1="400" y1="210" x2="400" y2="340" stroke="#8E44AD" stroke-width="2"/>
  <line x1="393" y1="210" x2="407" y2="210" stroke="#8E44AD" stroke-width="2"/>
  <line x1="393" y1="340" x2="407" y2="340" stroke="#8E44AD" stroke-width="2"/>
  <text x="412" y="265" font-size="13" fill="#8E44AD" font-style="italic">h</text>
  <text x="421" y="270" font-size="9" fill="#8E44AD" font-style="italic">X*</text>
  <text x="412" y="288" font-size="12" fill="#8E44AD">≪ 0</text>

  <!-- Result box -->
  <rect x="490" y="50" width="195" height="210" fill="#F8F9FA" stroke="#BDC3C7" stroke-width="1" rx="6"/>
  <text x="505" y="75" font-size="14" fill="#2C3E50" font-weight="bold">큰 낙차 사건</text>
  <text x="615" y="75" font-size="14" fill="#2C3E50" font-style="italic">E</text>
  <text x="624" y="79" font-size="10" fill="#2C3E50" font-style="italic">s</text>
  <line x1="505" y1="83" x2="672" y2="83" stroke="#BDC3C7" stroke-width="0.5"/>
  <text x="505" y="105" font-size="12" fill="#555">① block 발생</text>
  <text x="505" y="128" font-size="12" fill="#555">② 새 눈이 </text>
  <text x="581" y="128" font-size="12" fill="#555" font-style="italic">u</text>
  <text x="591" y="128" font-size="12" fill="#555">에 낙하</text>
  <text x="518" y="146" font-size="11" fill="#888">(확률 ≥ μ</text>
  <text x="587" y="150" font-size="8" fill="#888">min</text>
  <text x="605" y="146" font-size="11" fill="#888">)</text>
  <text x="505" y="168" font-size="12" fill="#555">③ flow → </text>
  <text x="579" y="168" font-size="12" fill="#555" font-style="italic">w</text>
  <text x="591" y="168" font-size="12" fill="#555"> 이하 정착</text>
  <text x="518" y="186" font-size="11" fill="#888">(확률 ≥ </text>
  <text x="577" y="186" font-size="11" fill="#888" font-style="italic">P</text>
  <text x="586" y="190" font-size="7" fill="#888">RW</text>
  <text x="600" y="186" font-size="11" fill="#888">(</text>
  <text x="605" y="186" font-size="11" fill="#888" font-style="italic">u, w</text>
  <text x="629" y="186" font-size="11" fill="#888">))</text>
  <line x1="505" y1="198" x2="672" y2="198" stroke="#BDC3C7" stroke-width="0.5"/>
  <text x="505" y="220" font-size="12" fill="#E74C3C" font-weight="bold">→ ΔΦ = 2b · h</text>
  <text x="622" y="224" font-size="8" fill="#E74C3C" font-style="italic">X*</text>
  <text x="505" y="240" font-size="11" fill="#E74C3C">→ </text>
  <text x="522" y="240" font-size="11" fill="#E74C3C" font-style="italic">M</text>
  <text x="535" y="240" font-size="11" fill="#E74C3C">(</text>
  <text x="540" y="240" font-size="11" fill="#E74C3C" font-style="italic">t</text>
  <text x="547" y="240" font-size="11" fill="#E74C3C">)에 비례하는 큰 음수</text>

  <!-- Bottom note -->
  <text x="120" y="410" font-size="12" fill="#666">* flow 중에는 새 눈이 떨어지지 않는다. block 후에만</text>
  <text x="120" y="410" font-size="12" fill="#666" font-style="italic"> </text>
  <text x="480" y="410" font-size="12" fill="#666" font-style="italic">X</text>
  <text x="491" y="414" font-size="8" fill="#666">fall</text>
  <text x="509" y="410" font-size="12" fill="#666"> ~ μ₀ 가 발생한다.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="aBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3498DB"/>
    </marker>
    <marker id="aRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#E74C3C"/>
    </marker>
  </defs>
</svg>
