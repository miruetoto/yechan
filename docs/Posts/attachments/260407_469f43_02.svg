<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Latin Modern Math','STIX Two Math','Cambria Math',serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- 축 -->
  <line x1="60" y1="290" x2="570" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="60" y1="290" x2="60" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="295" font-size="14" fill="#333">상태 공간</text>
  <text x="30" y="18" font-size="14" fill="#333" font-style="italic">Φ</text>

  <!-- B 영역 (refuge) -->
  <rect x="60" y="230" width="120" height="60" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="120" y="268" text-anchor="middle" font-size="16" fill="#1e8449" font-weight="bold">ℬ</text>
  <text x="120" y="284" text-anchor="middle" font-size="11" fill="#1e8449">(유한 refuge)</text>

  <!-- V = 0 라인 -->
  <text x="45" y="294" font-size="11" fill="#555">0</text>

  <!-- B 경계 수준선 -->
  <line x1="60" y1="230" x2="560" y2="230" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="540" y="225" font-size="11" fill="#27ae60" font-style="italic">Φ = C₁</text>

  <!-- V 곡선 (Lyapunov landscape) -->
  <path d="M60,230 Q120,200 180,140 Q240,80 320,60 Q400,45 480,55 Q530,62 560,80"
        fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="480" y="45" font-size="11" fill="#888">Φ(S) → ∞</text>

  <!-- 드리프트 화살표들 (B 바깥: 아래로) -->
  <line x1="200" y1="110" x2="175" y2="145" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="260" y1="85" x2="235" y2="120" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="330" y1="70" x2="305" y2="105" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="400" y1="62" x2="375" y2="97" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="470" y1="65" x2="445" y2="100" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- 드리프트 라벨 -->
  <text x="380" y="140" font-size="13" fill="#c0392b" font-style="italic">𝔼[ΔΦ] ≤ −1</text>
  <text x="380" y="156" font-size="11" fill="#c0392b">(ℬ 바깥: 평균적으로 하강)</text>

  <!-- B 안에서의 상승 가능 화살표 -->
  <line x1="100" y1="260" x2="115" y2="240" stroke="#2980b9" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="140" y1="255" x2="150" y2="238" stroke="#2980b9" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- B 안 라벨 -->
  <text x="200" y="250" font-size="11" fill="#2980b9">𝔼[ΔΦ] ≤ β</text>
  <text x="200" y="264" font-size="10" fill="#2980b9">(유계 상승)</text>

  <!-- 체인 경로 (지그재그로 B에 도달) -->
  <path d="M500,58 L485,75 L495,90 L470,110 L480,125 L450,150 L460,160 L430,185 L440,195 L400,215 L380,225 L340,235 L280,242 L200,250 L130,255"
        fill="none" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="4,2" opacity="0.7"/>
  <circle cx="500" cy="58" r="4" fill="#8e44ad"/>
  <circle cx="130" cy="255" r="4" fill="#8e44ad"/>
  <text x="505" y="52" font-size="11" fill="#8e44ad">S(0)</text>
  <text x="100" y="310" font-size="11" fill="#8e44ad">𝔼[τ_ℬ] ≤ Φ(S(0))</text>

  <!-- 핵심 논리 -->
  <rect x="200" y="5" width="280" height="42" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="340" y="21" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Φ ≥ 0 이고 밖에서 매 스텝 −1 이상 감소</text>
  <text x="340" y="37" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⟹ 유한 시간 안에 ℬ 도달 (𝔼[τ] &lt; ∞)</text>
</svg>
