<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.sub{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}
.node{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;text-anchor:middle;dominant-baseline:middle}
.small{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563;text-anchor:middle}
</style>
<text x="430" y="52" text-anchor="middle" class="title">P3 = K1,2 : the smallest asymmetric test graph</text>
<text x="430" y="91" text-anchor="middle" class="sub">f = 0, Model A, downstream-filter, degree-fall mu0 = (1/2, 1/4, 1/4)</text>
<line x1="250" y1="220" x2="430" y2="220" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
<line x1="430" y1="220" x2="610" y2="220" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
<circle cx="250" cy="220" r="50" fill="#7cc6a5" stroke="#276749" stroke-width="5"/>
<circle cx="430" cy="220" r="58" fill="#2f80c0" stroke="#124363" stroke-width="5"/>
<circle cx="610" cy="220" r="50" fill="#7cc6a5" stroke="#276749" stroke-width="5"/>
<text x="250" y="220" class="node">1</text>
<text x="430" y="220" class="node">0</text>
<text x="610" y="220" class="node">2</text>
<text x="250" y="302" class="small">leaf</text>
<text x="430" y="313" class="small">center, deg 2</text>
<text x="610" y="302" class="small">leaf</text>
<text x="430" y="372" text-anchor="middle" class="sub">The center is selected twice as often by the fall law, but when it is high it immediately exports flow to a leaf.</text>
</svg>
