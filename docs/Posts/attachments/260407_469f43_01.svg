<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="serif">
  <!-- Background -->
  <rect width="600" height="340" fill="white"/>

  <!-- Height axis -->
  <line x1="50" y1="30" x2="50" y2="300" stroke="#888" stroke-width="1.5"/>
  <polygon points="50,25 46,35 54,35" fill="#888"/>
  <text x="30" y="20" font-size="14" fill="#888" font-style="italic">h</text>

  <!-- Dashed height levels -->
  <line x1="45" y1="60" x2="560" y2="60" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="45" y1="260" x2="560" y2="260" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- M(t₀) bracket on left -->
  <line x1="65" y1="60" x2="65" y2="260" stroke="#E74C3C" stroke-width="2"/>
  <line x1="60" y1="60" x2="70" y2="60" stroke="#E74C3C" stroke-width="2"/>
  <line x1="60" y1="260" x2="70" y2="260" stroke="#E74C3C" stroke-width="2"/>
  <text x="72" y="165" font-size="14" fill="#E74C3C" font-style="italic">M(t₀)</text>

  <!-- Edges (path) -->
  <line x1="130" y1="60" x2="210" y2="90" stroke="#bbb" stroke-width="2"/>
  <line x1="210" y1="90" x2="290" y2="110" stroke="#bbb" stroke-width="2"/>
  <line x1="290" y1="110" x2="370" y2="210" stroke="#E74C3C" stroke-width="3"/>
  <line x1="370" y1="210" x2="450" y2="230" stroke="#bbb" stroke-width="2"/>
  <line x1="450" y1="230" x2="530" y2="260" stroke="#bbb" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="130" cy="60" r="7" fill="#2980B9" stroke="#1A5276" stroke-width="1.5"/>
  <circle cx="210" cy="90" r="5" fill="#7FB3D8" stroke="#5499C7" stroke-width="1"/>
  <circle cx="290" cy="110" r="7" fill="#E74C3C" stroke="#B03A2E" stroke-width="1.5"/>
  <circle cx="370" cy="210" r="7" fill="#E74C3C" stroke="#B03A2E" stroke-width="1.5"/>
  <circle cx="450" cy="230" r="5" fill="#7FB3D8" stroke="#5499C7" stroke-width="1"/>
  <circle cx="530" cy="260" r="7" fill="#2980B9" stroke="#1A5276" stroke-width="1.5"/>

  <!-- Node labels -->
  <text x="95" y="50" font-size="13" fill="#2980B9" font-weight="bold">v⁺ = v'₀</text>
  <text x="195" y="80" font-size="12" fill="#666">v'₁</text>
  <text x="248" y="100" font-size="13" fill="#E74C3C" font-weight="bold">v<tspan font-size="10" baseline-shift="sub">i*</tspan></text>
  <text x="375" y="200" font-size="13" fill="#E74C3C" font-weight="bold">v<tspan font-size="10" baseline-shift="sub">j*</tspan></text>
  <text x="435" y="222" font-size="12" fill="#666">v'₃</text>
  <text x="505" y="252" font-size="13" fill="#2980B9" font-weight="bold">v⁻ = v'<tspan font-size="10" baseline-shift="sub">m</tspan></text>

  <!-- Steep edge height difference bracket -->
  <line x1="330" y1="110" x2="330" y2="210" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="330,110 326,120 334,120" fill="#E74C3C"/>
  <polygon points="330,210 326,200 334,200" fill="#E74C3C"/>
  <text x="335" y="150" font-size="12" fill="#E74C3C">≥ M(t₀)</text>
  <text x="340" y="168" font-size="12" fill="#E74C3C">  n − 1</text>
  <line x1="340" y1="153" x2="395" y2="153" stroke="#E74C3C" stroke-width="0.8"/>

  <!-- Snow falling arrow -->
  <path d="M290,30 L290,100" stroke="#3498DB" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowBlue2)"/>
  <text x="295" y="45" font-size="11" fill="#3498DB">눈 낙하</text>
  <text x="295" y="58" font-size="11" fill="#3498DB">μ₀(v<tspan font-size="9" baseline-shift="sub">i*</tspan>)</text>

  <!-- Flow arrow from v_i* to v_j* -->
  <path d="M298,118 C320,150 340,180 365,205" stroke="#27AE60" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen2)"/>

  <!-- Possible continue flow from v_j* -->
  <path d="M378,215 C400,220 420,225 443,228" stroke="#27AE60" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowGreenLight2)"/>
  <text x="390" y="240" font-size="10" fill="#888">또는 계속 flow...</text>

  <!-- Label: steep edge -->
  <text x="240" y="320" font-size="14" fill="#E74C3C" font-weight="bold">경사 간선 (steep edge)</text>
  <line x1="310" y1="310" x2="330" y2="280" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3498DB"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27AE60"/>
    </marker>
    <marker id="arrowGreenLight2" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
