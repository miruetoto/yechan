<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img">
<rect width="100%" height="100%" fill="#fff"/>
<style>
.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;text-anchor:middle}
.txt{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151}
.tick{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#374151;text-anchor:middle}
.legend{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.math{font:16px Georgia,serif;fill:#111827}
</style>
<text x="430" y="42" class="title">Center-high cone: expected round visits flatten out</text>
<text x="92" y="74" class="txt">If h0-h1 and h0-h2 exceed b(Tmax+1), the order cannot flip inside the round.</text>
<line x1="92" y1="395" x2="800" y2="395" stroke="#111827" stroke-width="1.5"/>
<line x1="92" y1="96" x2="92" y2="395" stroke="#111827" stroke-width="1.5"/>
<line x1="92" y1="395.0" x2="800" y2="395.0" stroke="#d1d5db" stroke-width="1"/><text x="74" y="400.0" text-anchor="end" class="txt">0</text>
<line x1="92" y1="274.4" x2="800" y2="274.4" stroke="#d1d5db" stroke-width="1"/><text x="74" y="279.4" text-anchor="end" class="txt">0.25</text>
<line x1="92" y1="234.2" x2="800" y2="234.2" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 5"/><text x="74" y="239.2" text-anchor="end" class="txt">1/3</text>
<line x1="92" y1="153.9" x2="800" y2="153.9" stroke="#d1d5db" stroke-width="1"/><text x="74" y="158.9" text-anchor="end" class="txt">0.5</text>
<rect x="160.0" y="153.9" width="42" height="241.1" fill="#8ecae6" stroke="#125f82" stroke-width="2"/><rect x="218.0" y="153.9" width="42" height="241.1" fill="#ffb703" stroke="#9a6700" stroke-width="2"/><text x="210.0" y="424" class="tick">0 center</text>
<rect x="396.0" y="274.4" width="42" height="120.6" fill="#8ecae6" stroke="#125f82" stroke-width="2"/><rect x="454.0" y="153.9" width="42" height="241.1" fill="#ffb703" stroke="#9a6700" stroke-width="2"/><text x="446.0" y="424" class="tick">1 leaf</text>
<rect x="632.0" y="274.4" width="42" height="120.6" fill="#8ecae6" stroke="#125f82" stroke-width="2"/><rect x="690.0" y="153.9" width="42" height="241.1" fill="#ffb703" stroke="#9a6700" stroke-width="2"/><text x="682.0" y="424" class="tick">2 leaf</text>
<rect x="548" y="108" width="24" height="14" fill="#8ecae6" stroke="#125f82" stroke-width="2"/><text x="581" y="121" class="legend">fall law mu0</text>
<rect x="548" y="135" width="24" height="14" fill="#ffb703" stroke="#9a6700" stroke-width="2"/><text x="581" y="148" class="legend">expected visits pi(S)</text>
<line x1="548" y1="169" x2="572" y2="169" stroke="#6b7280" stroke-dasharray="5 5"/><text x="581" y="174" class="legend">1/3 target</text>
<text x="92" y="466" class="math">B(S) = sum_i pi_i(S) hbar_i = (1/2) sum_i hbar_i = 0, while M(S) can be arbitrarily large.</text>
</svg>
