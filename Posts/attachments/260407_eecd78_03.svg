<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="STIX Two Math, serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#1976d2"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#e53935"/>
    </marker>
  </defs>

  <!-- baseline -->
  <line x1="30" y1="220" x2="650" y2="220" stroke="#999" stroke-width="1.5"/>

  <!-- Step 0: X_fall -->
  <rect x="50" y="100" width="48" height="120" rx="4" fill="#42a5f5" opacity="0.8"/>
  <rect x="50" y="80" width="48" height="20" rx="4" fill="#e53935" opacity="0.9"/>
  <text x="74" y="94" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+b</text>
  <text x="74" y="240" text-anchor="middle" font-size="13" fill="#333" font-style="italic">X₀=X<tspan font-size="9" dy="-4">fall</tspan></text>
  <!-- height label -->
  <text x="10" y="106" font-size="10" fill="#666">y(X₀)+b</text>
  <line x1="44" y1="80" x2="640" y2="80" stroke="#e53935" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- flow arrow 0→1 -->
  <path d="M102,90 C130,50 145,50 168,105" fill="none" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="138" y="48" text-anchor="middle" font-size="10" fill="#1976d2">flow ↓</text>

  <!-- Step 1: X_1 -->
  <rect x="170" y="110" width="48" height="110" rx="4" fill="#66bb6a" opacity="0.7"/>
  <rect x="170" y="90" width="48" height="20" rx="4" fill="#e53935" opacity="0.9"/>
  <text x="194" y="104" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+b</text>
  <text x="194" y="240" text-anchor="middle" font-size="13" fill="#333" font-style="italic">X₁</text>
  <!-- ceiling 1 -->
  <text x="228" y="86" font-size="9" fill="#e53935">≤ y(X₀)+2b</text>

  <!-- flow arrow 1→2 -->
  <path d="M222,100 C250,60 265,60 288,118" fill="none" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="258" y="58" text-anchor="middle" font-size="10" fill="#1976d2">flow ↓</text>

  <!-- Step 2: X_2 -->
  <rect x="290" y="125" width="48" height="95" rx="4" fill="#ab47bc" opacity="0.7"/>
  <rect x="290" y="105" width="48" height="20" rx="4" fill="#e53935" opacity="0.9"/>
  <text x="314" y="119" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+b</text>
  <text x="314" y="240" text-anchor="middle" font-size="13" fill="#333" font-style="italic">X₂</text>
  <text x="348" y="101" font-size="9" fill="#e53935">≤ y(X₀)+3b</text>

  <!-- dots -->
  <text x="385" y="170" font-size="22" fill="#999">···</text>

  <!-- Step j: X_j -->
  <rect x="430" y="140" width="48" height="80" rx="4" fill="#ff9800" opacity="0.7"/>
  <rect x="430" y="120" width="48" height="20" rx="4" fill="#e53935" opacity="0.9"/>
  <text x="454" y="134" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+b</text>
  <text x="454" y="240" text-anchor="middle" font-size="13" fill="#333" font-style="italic">X<tspan font-size="9" dy="3">j</tspan></text>

  <!-- ceiling j brace -->
  <line x1="488" y1="100" x2="488" y2="220" stroke="#e53935" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="484" y1="100" x2="492" y2="100" stroke="#e53935" stroke-width="1.2"/>
  <line x1="484" y1="220" x2="492" y2="220" stroke="#e53935" stroke-width="1.2"/>
  <text x="496" y="145" font-size="10" fill="#e53935">≤ y(X₀)</text>
  <text x="502" y="158" font-size="10" fill="#e53935">+ jb</text>

  <!-- mean shift annotation -->
  <line x1="540" y1="220" x2="540" y2="195" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="536" y1="195" x2="544" y2="195" stroke="#666" stroke-width="1"/>
  <line x1="536" y1="220" x2="544" y2="220" stroke="#666" stroke-width="1"/>
  <text x="548" y="205" font-size="9" fill="#666">ȳ 증가:</text>
  <text x="548" y="217" font-size="9" fill="#666">jb/n</text>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">매 스텝 +b 적립 → 절대높이 천장이 b씩 상승</text>

  <!-- legend -->
  <rect x="540" y="38" width="14" height="14" rx="2" fill="#42a5f5" opacity="0.8"/>
  <text x="560" y="49" font-size="10" fill="#555">원래 높이 y(·)</text>
  <rect x="540" y="58" width="14" height="14" rx="2" fill="#e53935" opacity="0.9"/>
  <text x="560" y="69" font-size="10" fill="#555">+b 적립분</text>
</svg>